services:
  - type: web
    name: instascrape-pro
    env: node
    plan: standard
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_ORIGIN
        value: https://instascrape-pro.onrender.com
      - key: APIFY_TOKEN
        sync: false # Set securely in Render Dashboard (Apify Console > Integrations)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_RECAPTCHA_SITE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        value: INR
      - key: RAZORPAY_PLAN_WEEKLY
        sync: false
      - key: RAZORPAY_PLAN_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_YEARLY
        sync: false
      - key: FREE_RUNS_PER_DAY
        value: "1"
      - key: PAID_RUNS_PER_DAY
        value: "20"
      - key: SCRAPE_RATE_LIMIT_PER_HOUR
        value: "10"
      - key: MAX_CONCURRENT_RUNS
        value: "3"
      - key: MAX_RESULTS_PER_PROFILE
        value: "100"
      - key: PREVIEW_TTL_HOURS
        value: "12"
