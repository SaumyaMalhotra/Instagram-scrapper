<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Core Technical SEO Meta Tags -->
    <title>InstaScrape Pro | Instagram Profile Analyzer & Public Content Research</title>
    <meta
      name="description"
      content="Production-grade Instagram profile analyzer, public post viewer, and bio audit tool. Extract post metrics, audit profile presentation, and export data without logging in."
    />
    <meta name="keywords" content="Instagram profile analyzer, Instagram bio analyzer, Instagram profile audit tool, Instagram username search tool, Instagram public post viewer, free Instagram profile analysis tool, Instagram content research tool" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://instascrape-pro.onrender.com/" />
    <meta name="theme-color" content="#090b0e" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="c67d2c782091689d" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InstaScrape Pro" />
    <meta property="og:url" content="https://instascrape-pro.onrender.com/" />
    <meta property="og:title" content="InstaScrape Pro | Instagram Profile Analyzer & Public Content Research" />
    <meta property="og:description" content="Production-grade Instagram profile analyzer, public post viewer, and bio audit tool. Extract post metrics, audit profile presentation, and export data without logging in." />
    <meta property="og:image" content="https://instascrape-pro.onrender.com/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InstaScrape Pro | Instagram Profile Analyzer & Public Content Research" />
    <meta name="twitter:description" content="Production-grade Instagram profile analyzer, public post viewer, and bio audit tool. Extract post metrics, audit profile presentation, and export data without logging in." />
    <meta name="twitter:image" content="https://instascrape-pro.onrender.com/favicon.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json" id="seo-schema-root">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "InstaScrape Pro",
          "url": "https://instascrape-pro.onrender.com/",
          "logo": "https://instascrape-pro.onrender.com/favicon.svg",
          "description": "Instagram profile analysis and public content research platform."
        },
        {
          "@type": "WebSite",
          "name": "InstaScrape Pro",
          "url": "https://instascrape-pro.onrender.com/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://instascrape-pro.onrender.com/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: Space Grotesk & Inter with font-display swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
